name: Signaler les pages (IndexNow)

# Une fois par semaine, après la publication du lundi (5 h UTC), et à la demande.
# Pas à chaque commit : inutile de signaler plusieurs fois par jour les mêmes pages.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Le script lit le sitemap publié : il n'a besoin d'aucune dépendance.
      - run: node scripts/indexnow.mjs
