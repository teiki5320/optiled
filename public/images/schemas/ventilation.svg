<text x="610" y="300" class="v">brassage</text><text x="610" y="318" class="p">petit ventilateur :</text><text x="610" y="334" class="p">feuilles qui bougent</text><text x="610" y="350" class="p">doucement</text>
<text x="400" y="432" text-anchor="middle" class="m">Débit d'extraction (m³/h) ≈ volume de la tente (m³) × 60</text>
