<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"><title>Circulation de l'air dans une tente de culture : entrée d'air en bas, extraction en haut, brassage interne</title><defs><linearGradient id="barre" x1="0" x2="1"><stop offset="0" stop-color="#5b7cff"/><stop offset=".5" stop-color="#c26bff"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient><linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1d2" stop-opacity=".5"/><stop offset="1" stop-color="#ffb3d1" stop-opacity=".03"/></linearGradient><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffc15e"/></marker><marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffd08a"/></marker><marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7cb2ff"/></marker></defs><style>text{font-family:"Inter Variable",Inter,system-ui,sans-serif;fill:#f6ecf0}.t{font-size:28px;font-weight:700}.p{font-size:23px;fill:#dcbcc6}.v{font-size:24px;font-weight:700;fill:#ffd08a}.a{font-size:23px;font-weight:700;fill:#ffc15e}.m{font-family:ui-monospace,Menlo,monospace;font-size:22px;fill:#dcbcc6}</style><rect width="800" height="500" rx="18" fill="#221729"/>
<text x="40" y="50" class="t">Renouveler et brasser l'air</text>
<text x="40" y="84" class="p">Tente vue de côté</text>
