<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"><title>Circulation de l'air dans une tente de culture : entrée d'air en bas, extraction en haut, brassage interne</title><defs><linearGradient id="barre" x1="0" x2="1"><stop offset="0" stop-color="#5b7cff"/><stop offset=".5" stop-color="#c26bff"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient><linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1d2" stop-opacity=".5"/><stop offset="1" stop-color="#ffb3d1" stop-opacity=".03"/></linearGradient><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffc15e"/></marker><marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8ff0b3"/></marker><marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7cb2ff"/></marker></defs><style>text{font-family:"Inter Variable",Inter,system-ui,sans-serif;fill:#eef5ef}.t{font-size:15px;font-weight:700}.p{font-size:13px;fill:#a3b8a9}.v{font-size:14px;font-weight:700;fill:#8ff0b3}.a{font-size:13px;font-weight:700;fill:#ffc15e}.m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#a3b8a9}</style><rect width="800" height="440" rx="18" fill="#0c1510"/>
<text x="40" y="44" class="t">Renouveler et brasser l'air</text>
<text x="40" y="66" class="p">Tente vue de côté</text>
<rect x="170" y="90" width="420" height="320" rx="6" fill="#14231a" stroke="#a3b8a9" stroke-width="2"/>
<rect x="250" y="120" width="260" height="12" rx="6" fill="url(#barre)"/>
<path d="M250 132h260l50 200H200z" fill="url(#cone)" opacity=".7"/>
<g fill="#2fa860"><circle cx="270" cy="380" r="24"/><circle cx="340" cy="372" r="30"/><circle cx="420" cy="376" r="26"/><circle cx="492" cy="382" r="22"/></g>
<rect x="190" y="400" width="380" height="10" fill="#2a4435"/>
<rect x="520" y="96" width="60" height="30" rx="6" fill="#2a4435" stroke="#eef5ef"/><text x="550" y="116" text-anchor="middle" class="m" style="fill:#eef5ef">filtre</text>
<path d="M580 111h40" stroke="#a3b8a9" stroke-width="10"/><rect x="620" y="96" width="44" height="30" rx="6" fill="#2a4435" stroke="#eef5ef"/>
<path d="M670 111h70" stroke="#ffc15e" stroke-width="2.5" marker-end="url(#fl)"/>
<text x="640" y="150" text-anchor="middle" class="a">extraction</text><text x="640" y="168" text-anchor="middle" class="p">air chaud et humide</text>
<path d="M90 360h70" stroke="#7cb2ff" stroke-width="2.5" marker-end="url(#fb)"/>
<rect x="160" y="345" width="12" height="30" fill="#0c1510" stroke="#7cb2ff"/>
<text x="40" y="340" class="v" style="fill:#7cb2ff">entrée d'air</text><text x="40" y="396" class="p">frais, en bas</text>
<path d="M220 340c30-110 130-215 294-226" stroke="#ffc15e" stroke-width="1.5" fill="none" stroke-dasharray="6 6" marker-end="url(#fl)"/>
<circle cx="560" cy="300" r="18" fill="none" stroke="#8ff0b3" stroke-width="2"/><path d="M560 282v36M542 300h36" stroke="#8ff0b3" stroke-width="2"/>
