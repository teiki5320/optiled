<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"><title>Mesure en grille : 9 points de mesure du PPFD répartis sur la surface de culture</title><defs><linearGradient id="barre" x1="0" x2="1"><stop offset="0" stop-color="#5b7cff"/><stop offset=".5" stop-color="#c26bff"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient><linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1d2" stop-opacity=".5"/><stop offset="1" stop-color="#ffb3d1" stop-opacity=".03"/></linearGradient><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffc15e"/></marker><marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffd08a"/></marker><marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7cb2ff"/></marker></defs><style>text{font-family:"Inter Variable",Inter,system-ui,sans-serif;fill:#f6ecf0}.t{font-size:28px;font-weight:700}.p{font-size:23px;fill:#dcbcc6}.v{font-size:24px;font-weight:700;fill:#ffd08a}.a{font-size:23px;font-weight:700;fill:#ffc15e}.m{font-family:ui-monospace,Menlo,monospace;font-size:22px;fill:#dcbcc6}</style><rect width="800" height="500" rx="18" fill="#221729"/>
<text x="40" y="50" class="t">Mesurer en 9 points</text>
<text x="40" y="84" class="p">Capteur à hauteur des feuilles, vue de dessus</text>
<rect x="40" y="106" width="360" height="264" rx="10" fill="#3a2645" stroke="#7a5a86" stroke-width="2"/>
<g fill="#221729" stroke="#ffd08a" stroke-width="2">
<circle cx="100" cy="158" r="31"/><circle cx="220" cy="158" r="31"/><circle cx="340" cy="158" r="31"/>
<circle cx="100" cy="238" r="31"/><circle cx="220" cy="238" r="31"/><circle cx="340" cy="238" r="31"/>
<circle cx="100" cy="318" r="31"/><circle cx="220" cy="318" r="31"/><circle cx="340" cy="318" r="31"/></g>
<g class="v" text-anchor="middle">
<text x="100" y="166">210</text><text x="220" y="166">265</text><text x="340" y="166">215</text>
<text x="100" y="246">260</text><text x="220" y="246" style="fill:#ffc15e">320</text><text x="340" y="246">255</text>
<text x="100" y="326">205</text><text x="220" y="326">260</text><text x="340" y="326">210</text></g>
<text x="440" y="136" class="t">Exemple</text><text x="440" y="164" class="p">en µmol/m²/s</text>
<text x="440" y="214" class="p">Moyenne des 9 points</text><text x="440" y="244" class="v">≈ 244</text>
<text x="440" y="294" class="p">Minimum ÷ moyenne</text><text x="440" y="324" class="v">205 ÷ 244 ≈ 0,84</text>
<text x="40" y="414" class="p">Plus ce rapport approche 1, plus l'éclairage est homogène.</text>
<text x="40" y="450" class="a">Coins plus sombres : normal.</text>
<text x="40" y="480" class="a">Parois réfléchissantes : meilleure homogénéité.</text>
</svg>
