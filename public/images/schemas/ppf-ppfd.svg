<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img"><title>PPF émis par la lampe et PPFD reçu par les feuilles</title><defs><linearGradient id="barre" x1="0" x2="1"><stop offset="0" stop-color="#5b7cff"/><stop offset=".5" stop-color="#c26bff"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient><linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1d2" stop-opacity=".5"/><stop offset="1" stop-color="#ffb3d1" stop-opacity=".03"/></linearGradient><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffc15e"/></marker><marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffd08a"/></marker><marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7cb2ff"/></marker></defs><style>text{font-family:"Inter Variable",Inter,system-ui,sans-serif;fill:#f6ecf0}.t{font-size:15px;font-weight:700}.p{font-size:13px;fill:#dcbcc6}.v{font-size:14px;font-weight:700;fill:#ffd08a}.a{font-size:13px;font-weight:700;fill:#ffc15e}.m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#dcbcc6}</style><rect width="800" height="400" rx="18" fill="#221729"/>
<rect x="250" y="50" width="300" height="16" rx="8" fill="url(#barre)"/>
<path d="M250 66h300l110 250H140z" fill="url(#cone)"/>
<text x="400" y="36" text-anchor="middle" class="t">PPF : tout ce que la lampe émet</text>
<text x="570" y="63" class="v">ex. 500 µmol/s</text>
<path d="M160 330h480" stroke="#7a5a86" stroke-width="3"/>
<path d="M230 316h340v28H230z" fill="#3a2645" stroke="#ffd08a" stroke-dasharray="5 4"/>
<text x="400" y="336" text-anchor="middle" class="p">1 m² de culture</text>
<g fill="#2fa860"><circle cx="265" cy="310" r="14"/><circle cx="315" cy="306" r="17"/><circle cx="370" cy="309" r="15"/><circle cx="430" cy="306" r="17"/><circle cx="485" cy="310" r="14"/><circle cx="535" cy="307" r="16"/></g>
<rect x="382" y="262" width="36" height="12" rx="3" fill="#f6ecf0"/><path d="M400 274v24" stroke="#f6ecf0" stroke-width="3"/>
<text x="400" y="372" text-anchor="middle" class="t">PPFD : ce qui arrive sur 1 m² de feuilles, chaque seconde</text>
<text x="400" y="392" text-anchor="middle" class="v">ex. 400 µmol/m²/s mesuré au PAR-mètre</text>
<path d="M200 230 130 256" stroke="#ffc15e" stroke-width="2" marker-end="url(#fl)"/><path d="M600 230l70 26" stroke="#ffc15e" stroke-width="2" marker-end="url(#fl)"/>
<text x="30" y="282" class="a">pertes</text><text x="30" y="298" class="p">bords, parois</text>
<text x="686" y="282" class="a">pertes</text><text x="686" y="298" class="p">allées</text>
<text x="400" y="200" text-anchor="middle" class="m">PPFD moyen ≈ PPF × coefficient d'utilisation ÷ surface</text>
</svg>
