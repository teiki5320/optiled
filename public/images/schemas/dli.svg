<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img"><title>Le DLI est l'aire sous la courbe du PPFD au cours de la journée</title><defs><linearGradient id="barre" x1="0" x2="1"><stop offset="0" stop-color="#5b7cff"/><stop offset=".5" stop-color="#c26bff"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient><linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1d2" stop-opacity=".5"/><stop offset="1" stop-color="#ffb3d1" stop-opacity=".03"/></linearGradient><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffc15e"/></marker><marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffd08a"/></marker><marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7cb2ff"/></marker></defs><style>text{font-family:"Inter Variable",Inter,system-ui,sans-serif;fill:#f6ecf0}.t{font-size:28px;font-weight:700}.p{font-size:23px;fill:#dcbcc6}.v{font-size:24px;font-weight:700;fill:#ffd08a}.a{font-size:23px;font-weight:700;fill:#ffc15e}.m{font-family:ui-monospace,Menlo,monospace;font-size:22px;fill:#dcbcc6}</style><rect width="800" height="460" rx="18" fill="#221729"/>
<text x="40" y="50" class="t">DLI : la lumière cumulée sur la journée</text>
<text x="40" y="84" class="p">L'aire colorée = PPFD × durée d'éclairage</text>
<path d="M112 330h648M112 330V120" stroke="#7a5a86" stroke-width="2"/>
<g class="m"><text x="112" y="362" text-anchor="middle">0 h</text><text x="274" y="362" text-anchor="middle">6 h</text><text x="436" y="362" text-anchor="middle">12 h</text><text x="598" y="362" text-anchor="middle">18 h</text><text x="752" y="362" text-anchor="middle">24 h</text>
<text x="100" y="337" text-anchor="end">0</text><text x="100" y="197" text-anchor="end">250</text></g>
<text x="38" y="225" class="p" transform="rotate(-90 38 225)" text-anchor="middle">PPFD (µmol/m²/s)</text>
<defs><linearGradient id="aire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c26bff" stop-opacity=".75"/><stop offset="1" stop-color="#5b7cff" stop-opacity=".25"/></linearGradient></defs>
<path d="M274 330V190h432v140z" fill="url(#aire)"/>
<path d="M112 330h162V190h432v140h54" fill="none" stroke="#f6ecf0" stroke-width="2.5"/>
<path d="M274 158h432" stroke="#ffc15e" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/>
<text x="490" y="140" text-anchor="middle" class="a">photopériode : 16 h (6 h → 22 h)</text>
<text x="490" y="272" text-anchor="middle" class="t">14,4 mol/m²/j</text>
<text x="400" y="408" text-anchor="middle" class="v">DLI = 250 µmol/m²/s × 16 h × 3 600 s ÷ 1 000 000</text>
<text x="400" y="440" text-anchor="middle" class="v">= 14,4 mol/m²/j</text>
</svg>
